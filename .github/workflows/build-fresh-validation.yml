name: Build fresh validation inputs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-fresh-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Prepare pinned benchmark
        run: python -m benchmark.prepare

      - name: Select fresh validation cases
        run: python scripts/select_fresh_validation.py

      - name: Verify no gold is staged
        run: |
          test -f artifacts/fresh_validation_100_model_inputs.json
          test -f reports/fresh_validation_100_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/fresh_validation_100_manifest.json").read_text())
          assert m["cases"] == 100
          assert m["contains_gold"] is False
          assert all(v == 25 for v in m["workflow_counts"].values())
          assert len(m["case_ids_in_output_order"]) == 100
          PY

      - name: Commit generated non-gold artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fresh_validation_100_model_inputs.json reports/fresh_validation_100_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data: freeze fresh 100-case validation inputs"
            git push
          fi
