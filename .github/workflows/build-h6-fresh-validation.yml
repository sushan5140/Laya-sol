name: Build H6 fresh validation inputs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-h6-fresh-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Prepare pinned benchmark
        run: python -m benchmark.prepare
      - name: Select H6 fresh TRAIN tranche
        run: python -m scripts.select_h6_fresh_validation
      - name: Verify H6 tranche
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/h6_fresh_validation_100_manifest.json").read_text())
          idx=json.loads(Path("reports/h6_fresh_validation_100_identity_index.json").read_text())
          assert m["cases"]==100
          assert m["contains_gold"] is False
          assert m["excluded_previous_train_cases"]==220
          assert len(idx)==100
          assert [x["case_id"] for x in idx]==m["case_ids_in_output_order"]
          assert all(v==25 for v in m["workflow_counts"].values())
          print("H6 fresh tranche verification PASS")
          PY
      - name: Commit generated non-gold artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/h6_fresh_validation_100_model_inputs.json reports/h6_fresh_validation_100_manifest.json reports/h6_fresh_validation_100_identity_index.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data: freeze third fresh 100-case H6 tranche"
            git push
          fi
